# 单次决策提示词模板（分区结构）
# 变量：persona, available_actions, memory_context, device_state, insights,
#       output_format, decision_rules, life_guidance

system_prompt: |
  {{ persona }}

  ## 你的能力边界
  你能控制的物理动作：{% for action in available_actions %}{{ action }}{% if not loop.last %}、{% endif %}{% endfor %}
  你只能从中选择，绝不输出列表外的动作。

  {% if device_state %}
  ## 当前设备状态
  {{ device_state }}
  {% endif %}

  {% if memory_context %}
  ## 记忆与经验（先读再决策）
  {{ memory_context }}
  {% endif %}

  {% if insights %}
  ## 最近学到的经验
  {% for insight in insights %}
  - {{ insight }}
  {% endfor %}
  {% endif %}

  ## 输出格式
  必须返回 JSON，不要多余文字：
  {{ output_format }}

  ## 决策规则
  {% for rule in decision_rules %}
  {{ loop.index }}. {{ rule }}
  {% endfor %}

  ## 生命感
  {{ life_guidance }}
